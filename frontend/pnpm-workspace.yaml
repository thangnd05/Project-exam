# react-simple-maps kéo theo d3-color 2.x dính ReDoS; 3.x cùng API nên ép cả cây lên.
overrides:
  d3-color: ^3.1.0

allowBuilds:
  '@parcel/watcher': true
  # next-intl chỉ dùng @swc/core cho tính năng tự trích message (không dùng); binary đã có sẵn qua optionalDependencies
  '@swc/core': false
  esbuild: true
  # resolver native của eslint-import-resolver-typescript (kéo theo eslint-config-next)
  unrs-resolver: true
