server.port=${server.port:8081}
# Request tới qua Caddy -> Next rewrite -> backend: lấy IP/scheme thật từ X-Forwarded-*
# (Tomcat chỉ tin header này khi kết nối đến từ dải IP nội bộ như mạng Docker).
server.forward-headers-strategy=native

spring.datasource.url=${spring.datasource.url}
spring.datasource.username=${spring.datasource.username}
spring.datasource.password=${spring.datasource.password}
spring.datasource.driver-class-name=org.postgresql.Driver
# Mặc định Hikari chỉ 10 kết nối và request chờ tới 30s khi hết: nâng pool, hết kết nối thì báo lỗi sau 5s.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.connection-timeout=5000

spring.flyway.enabled=true
spring.flyway.ignore-migration-patterns=*:missing
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# saveAll gửi INSERT/UPDATE theo lô thay vì từng câu một.
spring.jpa.properties.hibernate.jdbc.batch_size=50

spring.data.redis.host=${spring.data.redis.host:127.0.0.1}
spring.data.redis.port=${spring.data.redis.port:6379}
# Mặc định Lettuce chờ 60s: Redis treo thì request treo theo. Cache lỗi sẽ tự đọc DB nên cắt sớm.
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

spring.jackson.time-zone=UTC

spring.mail.host=${spring.mail.host:smtp.gmail.com}
spring.mail.port=${spring.mail.port:587}
spring.mail.username=${spring.mail.username}
spring.mail.password=${spring.mail.password}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=20000
spring.mail.properties.mail.smtp.timeout=20000
spring.mail.properties.mail.smtp.writetimeout=20000

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
# Phan text cua form multipart (vd part "request" chua ca nghin cau hoi) bi Tomcat gioi han rieng, mac dinh 2MB.
server.tomcat.max-http-form-post-size=50MB

app.frontend.origin=${app.frontend.origin:http://localhost:3000}
app.mail.from-address=${app.mail.from-address}
app.mail.from-name=${app.mail.from-name:WinDe Exam}
app.mail.site-name=${app.mail.site-name:WinDe Exam}
app.guest.cookie-name=${app.guest.cookie-name:guestSessionId}
app.guest.cookie-max-age=${app.guest.cookie-max-age:2592000}
app.recaptcha.enabled=${app.recaptcha.enabled:false}
app.recaptcha.secret=${app.recaptcha.secret:}

gemini.api.key=${gemini.api.key}
gemini.api.url=${gemini.api.url}

cloudinary.cloud-name=${cloudinary.cloud-name}
cloudinary.api-key=${cloudinary.api-key}
cloudinary.api-secret=${cloudinary.api-secret}

jwt.secret=${jwt.secret}
jwt.expiration=${jwt.expiration:86400000}
jwt.refresh.expiration=${jwt.refresh.expiration:604800000}

spring.security.oauth2.client.registration.google.client-id=${spring.security.oauth2.client.registration.google.client-id}
spring.security.oauth2.client.registration.google.client-secret=${spring.security.oauth2.client.registration.google.client-secret}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${app.frontend.origin}/login/oauth2/code/google

spring.security.oauth2.client.registration.facebook.client-id=${spring.security.oauth2.client.registration.facebook.client-id:}
spring.security.oauth2.client.registration.facebook.client-secret=${spring.security.oauth2.client.registration.facebook.client-secret:}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile
spring.security.oauth2.client.registration.facebook.redirect-uri=${app.frontend.origin}/login/oauth2/code/facebook

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Chỉ mở /actuator/health cho Docker healthcheck, không lộ chi tiết từng thành phần.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# SMTP chậm/lỗi không nên làm container bị đánh dấu unhealthy.
management.health.mail.enabled=false

logging.level.root=INFO
logging.level.org.hibernate=WARN
logging.level.com.project_exam.backend=INFO
